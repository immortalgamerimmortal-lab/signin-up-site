<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Sign In | Create Account</title>
</head>
<body>
     <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="signup-form">
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="icon" aria-label="Continue with Google"><i class="fa-brands fa-google-plus-g" aria-hidden="true"></i></a>
                    <a href="#" class="icon" aria-label="Continue with Facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
                    <a href="#" class="icon" aria-label="Continue with LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
                    <a href="#" class="icon" aria-label="Continue with GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" name="name" placeholder="Name" autocomplete="name" aria-label="Name" required>
                <input type="email" name="email" placeholder="Email" autocomplete="email" aria-label="Email" required>
                <input type="password" name="password" placeholder="Password" autocomplete="new-password" aria-label="Password" required>
                <button type="submit">Sign up</button>
            </form>
        </div>
          <div class="form-container sign-in">
                <form id="signin-form">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon" aria-label="Continue with Google"><i class="fa-brands fa-google-plus-g" aria-hidden="true"></i></a>
                    <a href="#" class="icon" aria-label="Continue with Facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
                    <a href="#" class="icon" aria-label="Continue with LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
                    <a href="#" class="icon" aria-label="Continue with GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
                </div>
                <span>or use your email and password</span>
                <input type="email" name="email" placeholder="Email" autocomplete="email" aria-label="Email" required>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
                <button type="submit">Sign in</button>
                <a href="#" class="forgot-password">Forgot your password?</a>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h2>Welcome back</h2>
                    <p>Pick up where you left off.</p>
                    <button class="hidden" type="button" id="login">Sign in</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h2>New around here?</h2>
                    <p>Create an account and get started.</p>
                    <button class="hidden" type="button" id="register">Create account</button>
                </div>
            </div>
        </div>
    </div>
    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
    <script src="app.js"></script>
</body>
</html>
